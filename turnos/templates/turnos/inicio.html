<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Turnos Médicos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #386EF9; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: white;
            overflow: hidden;
        }

        header {
            width: 100%;
            padding: 40px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-titulo {
            font-size: 28px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .btn-iniciar {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 18px;
            transition: color 0.2s ease;
        }

        .btn-iniciar:hover {
            color: #50D6F1; 
        }

        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-titulo">Sistema de Gestión de Turnos Médicos</div>
        <a href="{% url 'elegir_portal' %}" class="btn-iniciar">Iniciar sesión</a>
    </header>

    <div class="content">
        </div>

</body>
</html>
