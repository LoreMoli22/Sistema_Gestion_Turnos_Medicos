<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Portal Paciente</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #FFFFFF; min-height: 100vh; display: flex; flex-direction: column; }
        header { width: 100%; padding: 40px 50px; }
        .logo-titulo { font-size: 28px; font-weight: 500; color: #386EF9; }
        .contenedor-principal { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .tarjeta-azul { background-color: #386EF9; width: 100%; max-width: 450px; padding: 40px 35px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); color: white; text-align: center; }
        .tarjeta-azul h2 { font-size: 24px; font-weight: 500; margin-bottom: 10px; }
        .tarjeta-azul p { font-size: 15px; color: rgba(255,255,255,0.85); margin-bottom: 25px; }
        .grupo-campo { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 20px; width: 100%; }
        .grupo-campo label { font-size: 16px; font-weight: 500; margin-bottom: 8px; color: #FFFFFF; }
        .caja-entrada { background-color: #DCDCDC; border: none; padding: 12px 15px; border-radius: 10px; font-size: 16px; width: 100%; outline: none; color: #333333; }
        .btn-enviar { background-color: #50D6F1; color: #FFFFFF; border: none; font-size: 18px; font-weight: 600; padding: 12px 0; border-radius: 10px; width: 100%; cursor: pointer; margin-top: 15px; transition: background-color 0.2s ease; }
        .btn-enviar:hover { background-color: #3bc2dd; }
        .btn-volver { display: block; margin-top: 15px; color: rgba(255,255,255,0.8); text-decoration: none; font-size: 15px; }
        .btn-volver:hover { color: white; }
    </style>
</head>
<body>
    <header>
        <div class="logo-titulo">Sistema de Gestión de Turnos Médicos</div>
    </header>

    {% if messages %}
        {% for message in messages %}
            <p style="color: green; font-size: 16px; text-align: center; margin-top: 20px;">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <div class="contenedor-principal">
        <div class="tarjeta-azul">
            <h2>Recuperar Contraseña</h2>
            <p>Ingresá tu DNI y te enviaremos una contraseña a tu email.</p>
            <form action="{% url 'recuperar_contrasena_paciente' %}" method="POST">
                {% csrf_token %}
                <div class="grupo-campo">
                    <label for="dni">DNI</label>
                    <input type="text" id="dni" name="dni" class="caja-entrada" required>
                </div>
                <button type="submit" class="btn-enviar">Enviar contraseña </button>
            </form>
            <a href="{% url 'ingreso_paciente' %}" class="btn-volver">Volver al ingreso</a>
        </div>
    </div>
</body>
</html>
