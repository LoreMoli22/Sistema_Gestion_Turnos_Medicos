<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Turnos Médicos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #386EF9; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: white;
            overflow: hidden;
        }

        header {
            width: 100%;
            padding: 40px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-titulo {
            font-size: 28px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .btn-iniciar {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 18px;
            transition: color 0.2s ease;
        }

        .btn-iniciar:hover {
            color: #50D6F1; 
        }

        /* Estilos agregados para que el mensaje de éxito se vea hermoso */
        .contenedor-mensajes {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 10px 50px;
        }

        .mensaje-alerta {
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }


        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-titulo">Sistema de Gestión de Turnos Médicos</div>
        <a href="{% url 'elegir_portal' %}" class="btn-iniciar">Iniciar sesión</a>
    </header>

    <!-- 🚀 BLOQUE DE MENSAJES DE DJANGO AGREGADO AQUÍ -->
    {% if messages %}
        <div class="contenedor-mensajes">
            {% for message in messages %}
                <div class="mensaje-alerta">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}


    <div class="content">
        </div>

</body>
</html>
