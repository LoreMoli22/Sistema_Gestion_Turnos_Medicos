<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Portal - Gestión de Turnos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #386EF9; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: white;
            overflow: hidden;
        }

        header {
            width: 100%;
            padding: 40px 50px;
        }

        .logo-titulo {
            font-size: 28px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Contenedor central para los botones, diseño vertical */
        .contenedor-portales {
            flex: 1;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            gap: 25px; /* Espacio vertical entre los dos botones */
        }

        .btn-portal {
            background-color: #50D6F1; 
            color: #333333; 
            text-decoration: none;
            font-size: 24px;
            font-weight: 600;
            padding: 25px 0; 
            border-radius: 15px; 
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, background-color 0.2s ease;
            text-align: center;
            
            
            display: inline-block; /* Claves para que tengan la misma medida exacta */
            width: 380px; /* Ancho idéntico para ambos */
        }

        .btn-portal:hover {
            transform: translateY(-5px); /* Efecto al pasar el mouse */
            background-color: #3bc2dd; 
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-titulo">Sistema de Gestión de Turnos Médicos</div>
    </header>

    <div class="contenedor-portales">
        <a href="{% url 'ingreso_paciente' %}" class="btn-portal">Portal Paciente</a>
        <a href="{% url 'ingreso_profesional' %}" class="btn-portal">Portal del Profesional</a>
    </div>

    <footer style="background-color: #386EF9; color: white; padding: 20px; text-align: center; margin-top: auto; width: 100%; font-size: 12px;">
        <p>Sistema de Gestión de Turnos Médicos - Desarrollado por Verónica Lorena Molinaroli</p>
        <p>© 2026 Todos los derechos reservados V1.0</p>
    </footer>

</body>
</html>
