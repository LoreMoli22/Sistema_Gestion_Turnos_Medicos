<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Turno - Gestión de Turnos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #FFFFFF;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background-color: #386EF9;
            width: 100%;
            padding: 25px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .logo-titulo {
            font-size: 24px;
            font-weight: 500;
            color: #FFFFFF;
            letter-spacing: 0.5px;
        }

        .subtitulo-portal {
            font-size: 26px;
            font-style: italic;
            font-weight: 500;
            color: #FFFFFF;
        }

        .contenedor-formulario {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }

        .fila-campo {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 20px;
        }

        .etiqueta-caja {
            background-color: #FFFFFF;
            border: 1px solid #A0A0A0;
            color: #000000;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 16px;
            width: 160px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .caja-entrada {
            background-color: #DCDCDC;
            border: none;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 16px;
            flex: 1;
            outline: none;
            color: #333333;
        }

        .btn-accion {
            border: none;
            font-size: 16px;
            font-weight: 500;
            padding: 10px 0;
            border-radius: 8px;
            width: 220px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            color: #000000;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.1s ease, filter 0.2s ease;
        }

        .btn-accion:hover {
            filter: brightness(0.9);
            transform: translateY(-1px);
        }

        .btn-confirmar {
            background-color: #00B050;
            margin-top: 15px;
        }

        .btn-cancelar {
            background-color: #FF3B3F;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-titulo">Sistema de Gestión de Turnos Médicos</div>
        <div class="subtitulo-portal">Portal Paciente</div>
    </header>

    <div class="contenedor-formulario">
        <form action="{% url 'solicitar_turno' %}" method="POST">
            {% csrf_token %}

            <div class="fila-campo">
                <div class="etiqueta-caja">Profesional</div>
                <select name="profesional" class="caja-entrada" required>
                    <option value="">-- Seleccioná un profesional --</option>
                    {% for p in profesionales %}
                        <option value="{{ p.id }}">Dr/a. {{ p.apellido }}, {{ p.nombre }} ({{ p.especialidad }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="fila-campo">
                <div class="etiqueta-caja">Fecha</div>
                <input type="date" name="fecha" class="caja-entrada" required>
            </div>

            <div class="fila-campo">
                <div class="etiqueta-caja">Hora</div>
                <input type="time" name="hora" class="caja-entrada" required>
            </div>

            <div class="fila-campo">
                <div class="etiqueta-caja">Motivo</div>
                <input type="text" name="motivo" class="caja-entrada">
            </div>

            <button type="submit" class="btn-accion btn-confirmar">Confirmar Turno</button>
            <a href="{% url 'lista_turnos' %}" class="btn-accion btn-cancelar">Cancelar</a>

        </form>
    </div>

</body>
</html>
