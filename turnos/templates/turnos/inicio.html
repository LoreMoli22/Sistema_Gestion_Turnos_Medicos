<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Turnos Médicos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #386EF9; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: white;
            overflow: hidden;
        }

        header {
            width: 100%;
            padding: 40px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-titulo {
            font-size: 28px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .btn-iniciar {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 18px;
            transition: color 0.2s ease;
        }

        .btn-iniciar:hover {
            color: #50D6F1; 
        }

        /* Estilos agregados para que el mensaje de éxito se vea hermoso */
        .contenedor-mensajes {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 10px 50px;
        }

        .mensaje-alerta {
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }


        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-titulo">Sistema de Gestión de Turnos Médicos</div>
        <a href="{% url 'elegir_portal' %}" class="btn-iniciar">Iniciar sesión</a>
    </header>

        {% if messages %}
            <div id="mensaje-temporal" style="
                max-width: 600px; 
                margin: 20px auto; 
                padding: 15px; 
                background-color: #d4edda !important; 
                color: #155724 !important; 
                border: 1px solid #c3e6cb !important; 
                border-radius: 8px; 
                text-align: center;
            ">
                {% for message in messages %}
                    <p style="margin: 0; font-weight: 500;">{{ message }}</p>
                {% endfor %}
            </div>
    
            <script>
                setTimeout(function() {
                    var el = document.getElementById('mensaje-temporal');
                    if(el) el.style.display = 'none';
                }, 3000);
            </script>
        {% endif %}
         
        
    <div class="content">
        </div>

    <footer style="background-color: #386EF9; color: white; padding: 20px; text-align: center; margin-top: auto; width: 100%; font-size: 12px;">
        <p>Sistema de Gestión de Turnos Médicos - Desarrollado por Verónica Lorena Molinaroli</p>
        <p>© 2026 Todos los derechos reservados V1.0</p>
    </footer>

</body>
</html>
