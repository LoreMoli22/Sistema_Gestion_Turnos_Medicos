<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso Administrador</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #FFFFFF; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        
        .login-box {
            width: 100%;
            max-width: 400px;
            background: #fff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border-top: 5px solid #386EF9; /* Tu celeste/azul institucional */
        }
        
        h2 { color: #386EF9; text-align: center; margin-bottom: 10px; font-weight: 600; }
        p { color: #666; text-align: center; margin-bottom: 30px; font-size: 15px; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #333; margin-bottom: 8px; font-weight: 500; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #DCDCDC; border-radius: 8px; font-size: 15px; outline: none; }
        input:focus { border-color: #386EF9; }
        
        .btn-ingresar {
            width: 100%;
            background-color: #386EF9;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 6px rgba(56, 110, 249, 0.2);
        }
        .btn-ingresar:hover { filter: brightness(0.9); }
        
        .error-message { background-color: #F8D7DA; color: #721C24; padding: 10px; border-radius: 6px; margin-bottom: 20px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Portal Admin</h2>
        <p>Iniciá sesión para gestionar el sistema</p>
        
        {% if messages %}
            {% for message in messages %}
                <div class="error-message">{{ message }}</div>
            {% endfor %}
        {% endif %}
        
        <form method="POST">
            {% csrf_csrf_token %}
            <div class="form-group">
                <label for="usuario">Usuario Administrador</label>
                <input type="text" id="usuario" name="usuario" placeholder="Ej: admin" required>
            </div>
            
            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-ingresar">Ingresar al Panel</button>
        </form>
    </div>

</body>
</html>
